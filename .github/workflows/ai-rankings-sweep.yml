# AI Rankings — the daily check, in three halves.
# Once a day GitHub pings the live site's sweep, which (1) reads Hugging Face's
# trending models AND the Artificial Analysis boards and files new releases in
# the owner's inbox — the arenas are what make a hosted model findable, since
# Veo and Kling have no HF repo to trend; (2) re-reads the arena scores; and
# (3) re-reads the measured prices, throughput and context windows the score
# dimensions are made of. Nothing new is published until the owner approves it
# in the app; scores and measurements already on the board are updated in
# place, and a measurement the owner typed by hand is never overwritten.
# Needs the AI_RANKINGS_SWEEP_TOKEN secret set here AND on Vercel; without it
# the route refuses the call and the owner can still press "Check now".
# The score half also needs ARTIFICIAL_ANALYSIS_API_KEY on Vercel (nothing
# here) — without it the releases half still runs and the inbox says so.
name: ai-rankings-sweep
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check for new releases and refresh scores
        env:
          TOKEN: ${{ secrets.AI_RANKINGS_SWEEP_TOKEN }}
          SITE: ${{ vars.PERSONAS_SITE_URL || 'https://ultimate-assistant-os.vercel.app' }}
        run: |
          if [ -z "$TOKEN" ]; then echo "AI_RANKINGS_SWEEP_TOKEN is not set; skipping."; exit 0; fi
          curl -fsS --max-time 70 -X POST -H "Authorization: Bearer $TOKEN" "$SITE/api/ai-rankings/sweep" || echo "sweep failed; tomorrow's run retries"
