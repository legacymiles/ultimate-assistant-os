<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estate Film</title>
<meta name="description" content="A private architectural film of the residence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<!--
  REAL ESTATE REVEAL — estate film engine
  Everything property-specific lives in the FILM block below. The engine reads it,
  builds one fixed stage of stacked clips, and maps scroll position onto clip time.
  Scroll down plays the camera forward; scroll up plays it backwards.

  Clips come from scripts/prep-clips.mjs (short GOP, so seeking is cheap):
    clips/01.mp4  clips/01-m.mp4  clips/01.jpg
  A scene with no video (or a video that fails) falls back to its poster with a slow push,
  so the page is always whole.
-->
<script id="film" type="application/json">
{
  "property": {
    "address": "{{ADDRESS}}",
    "location": "{{LOCATION}}",
    "price": "{{PRICE}}",
    "line": "A private residence in {{LOCATION}}"
  },
  "agent": { "name": "{{AGENT_NAME}}", "phone": "{{AGENT_PHONE}}", "email": "{{AGENT_EMAIL}}", "brokerage": "{{BROKERAGE}}" },
  "form": { "action": "" },
  "palette": { "ink": "#f4efe6", "dim": "rgba(244,239,230,.62)", "shade": "#0e0c0a", "accent": "#c9b79c" },
  "scenes": [
    { "id": "arrival",  "chapter": "Arrival",       "video": "clips/01.mp4", "mobile": "clips/01-m.mp4", "poster": "clips/01.jpg", "length": 1.6, "focus": "50% 50%",
      "captions": [] },
    { "id": "entry",    "chapter": "The residence", "video": "clips/02.mp4", "mobile": "clips/02-m.mp4", "poster": "clips/02.jpg", "length": 1.4, "focus": "50% 50%",
      "facts": ["{{SQFT}} sq ft", "{{BEDS}} bedrooms", "{{BATHS}} bathrooms", "{{LOT}} lot"], "factsAt": [0.25, 0.8] },
    { "id": "living",   "chapter": "Living",        "video": "clips/03.mp4", "mobile": "clips/03-m.mp4", "poster": "clips/03.jpg", "length": 1.4, "focus": "50% 50%",
      "captions": [ { "text": "Floor to ceiling glass", "at": [0.2, 0.7], "place": "right" } ] },
    { "id": "signature","chapter": "Kitchen",       "video": "clips/04.mp4", "mobile": "clips/04-m.mp4", "poster": "clips/04.jpg", "length": 1.8, "focus": "50% 50%",
      "captions": [ { "text": "Stone surfaces", "at": [0.15, 0.5], "place": "left" }, { "text": "Custom cabinetry", "at": [0.5, 0.85], "place": "right" } ] },
    { "id": "threshold","chapter": "Outdoors",      "video": "clips/05.mp4", "mobile": "clips/05-m.mp4", "poster": "clips/05.jpg", "length": 1.3, "focus": "50% 50%",
      "captions": [ { "text": "Covered terrace", "at": [0.3, 0.8], "place": "center" } ] },
    { "id": "finale",   "chapter": "Pool and grounds", "video": "clips/06.mp4", "mobile": "clips/06-m.mp4", "poster": "clips/06.jpg", "length": 1.8, "focus": "50% 60%",
      "captions": [ { "text": "Pool and grounds", "at": [0.12, 0.62], "place": "right" } ] }
  ]
}
</script>
<style>
  :root {
    --ink: #f4efe6;
    --dim: rgba(244,239,230,.62);
    --shade: #0e0c0a;
    --accent: #c9b79c;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Jost", system-ui, sans-serif;
    --gutter: clamp(20px, 4.2vw, 64px);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--shade); }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  body { background: var(--shade); color: var(--ink); font-family: var(--sans); font-weight: 300;
         -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  /* ---- stage: every clip stacked, fixed behind the scroll track ---- */
  .stage { position: fixed; inset: 0; overflow: hidden; background: var(--shade); }
  .shot { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
  .shot video, .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shot img { transform-origin: 50% 50%; will-change: transform; }
  .shot.has-video img { visibility: hidden; }          /* poster only until the clip can paint */
  .shot.has-video.waiting img { visibility: visible; }
  .veil { position: absolute; inset: 0; pointer-events: none;
          background: linear-gradient(180deg, rgba(0,0,0,.38) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%); }

  /* ---- chrome ---- */
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between;
         align-items: center; padding: 18px var(--gutter); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
  .bar a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  .bar a:hover, .bar a:focus-visible { color: var(--ink); border-color: var(--accent); outline: none; }
  .rail { position: fixed; top: 0; left: 0; height: 1px; width: 100%; z-index: 6; background: var(--accent);
          transform-origin: 0 50%; transform: scaleX(0); opacity: .7; }
  .chapter { position: fixed; right: var(--gutter); bottom: 28px; z-index: 5; font-size: 11px; letter-spacing: .24em;
             text-transform: uppercase; color: var(--dim); display: flex; gap: 14px; align-items: baseline; }
  .chapter b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---- words over the film ---- */
  .layer { position: fixed; inset: 0; z-index: 4; pointer-events: none; text-shadow: 0 1px 28px rgba(0,0,0,.45), 0 0 2px rgba(0,0,0,.25); }
  .hero { position: absolute; left: var(--gutter); bottom: clamp(56px, 11vh, 120px); max-width: min(92vw, 900px); }
  .hero h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(44px, 7.4vw, 118px); line-height: .95; letter-spacing: -.01em; }
  .hero p { margin-top: 18px; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }
  .hero p span + span::before { content: "·"; margin: 0 .9em; color: var(--accent); }
  .cap { position: absolute; max-width: min(80vw, 560px); opacity: 0; will-change: opacity, transform; }
  .cap strong { display: block; font-family: var(--serif); font-weight: 300; font-style: italic; font-size: clamp(30px, 3.8vw, 58px); line-height: 1.02; }
  .cap small { display: block; margin-top: 12px; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }
  .cap.right  { right: var(--gutter); top: 50%; text-align: right; }
  .cap.left   { left: var(--gutter);  top: 50%; }
  .cap.center { left: 50%; top: 50%; text-align: center; }
  .facts { position: absolute; left: var(--gutter); bottom: clamp(56px, 11vh, 120px); list-style: none; padding: 0; display: grid; gap: 6px; }
  .facts li { font-family: var(--serif); font-size: clamp(26px, 3vw, 44px); font-weight: 300; opacity: 0; will-change: opacity, transform; }
  .facts li:first-child::before { content: ""; display: block; width: 36px; height: 1px; background: var(--accent); margin-bottom: 18px; }

  /* ---- scroll track + finale (real DOM, so the form is interactive) ---- */
  #track { position: relative; z-index: 1; }
  /* Content sits at the top of the section, so it rises into view whole rather than
     letting a half-cut headline peek in over the last scene. */
  .finale { position: relative; z-index: 7; min-height: 100vh; display: grid; align-content: center;
            text-shadow: 0 1px 24px rgba(0,0,0,.35);
            padding: 0 var(--gutter) clamp(40px, 8vh, 96px);
            background: linear-gradient(180deg, rgba(14,12,10,0) 0%, rgba(14,12,10,.28) 40%, rgba(14,12,10,.72) 100%); }
  .showing { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: clamp(28px, 6vw, 96px); align-items: end; }
  .showing h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(40px, 5.6vw, 88px); line-height: .98; }
  .showing .agent { margin-top: 28px; font-size: 13px; line-height: 1.9; color: var(--dim); }
  .showing .agent b { display: block; font-weight: 400; color: var(--ink); letter-spacing: .04em; }
  .showing .agent a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(244,239,230,.25); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 22px; }
  form label { display: grid; gap: 6px; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
  form label.wide { grid-column: 1 / -1; }
  input, textarea { font: 400 15px/1.4 var(--sans); color: var(--ink); background: transparent; border: 0;
                    border-bottom: 1px solid rgba(244,239,230,.35); padding: 8px 0; border-radius: 0; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type="date"] { color-scheme: dark; }
  textarea { resize: vertical; min-height: 44px; }
  button { grid-column: 1 / -1; justify-self: start; font: 500 11px/1 var(--sans); letter-spacing: .28em; text-transform: uppercase;
           color: var(--shade); background: var(--ink); border: 0; padding: 18px 30px; cursor: pointer; transition: background .3s; }
  button:hover, button:focus-visible { background: var(--accent); outline: none; }
  .sent { grid-column: 1 / -1; font-family: var(--serif); font-size: 26px; font-style: italic; }
  footer { position: relative; z-index: 7; padding: 22px var(--gutter); font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
           color: var(--dim); background: rgba(14,12,10,.72); }

  /* ---- loader ---- */
  .loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--shade);
            transition: opacity .9s ease, visibility .9s; }
  .loader.done { opacity: 0; visibility: hidden; }
  .loader p { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
  .loader i { display: block; margin-top: 16px; height: 1px; width: 160px; background: rgba(244,239,230,.15); position: relative; overflow: hidden; }
  .loader i::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(var(--p, 0)); transform-origin: 0 50%; transition: transform .3s; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 760px) {
    .showing { grid-template-columns: 1fr; }
    form { grid-template-columns: 1fr; }
    .cap.right, .cap.left { left: var(--gutter); right: var(--gutter); text-align: left; top: auto; bottom: 30vh; }
    .chapter span { display: none; }
    .hero p span { display: block; line-height: 2; }
    .hero p span + span::before { content: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .loader { transition: none; }
  }
</style>
</head>
<body>
  <div class="loader" id="loader" aria-hidden="true"><div><p>Loading the residence</p><i></i></div></div>

  <div class="stage" id="stage" aria-hidden="true"></div>

  <header class="bar">
    <span id="barAddress"></span>
    <a href="#showing">Private showing</a>
  </header>
  <div class="rail" id="rail"></div>
  <div class="chapter" aria-hidden="true"><b id="chapNum">01</b><span id="chapName"></span></div>

  <div class="layer" id="layer">
    <div class="hero" id="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroMeta"></p>
    </div>
  </div>

  <main>
    <!-- Screen readers and search engines get the facts as text; the film is decoration. -->
    <h2 class="sr" id="srTitle"></h2>
    <ul class="sr" id="srFacts"></ul>
    <div id="track"></div>

    <section class="finale" id="showing" aria-labelledby="showingTitle">
      <div class="showing">
        <div>
          <h2 id="showingTitle">Experience the Residence</h2>
          <div class="agent" id="agent"></div>
        </div>
        <form id="form" novalidate>
          <label>Name<input name="name" autocomplete="name" required></label>
          <label>Email<input name="email" type="email" autocomplete="email" required></label>
          <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
          <label>Preferred showing date<input name="date" type="date"></label>
          <label class="wide">Message<textarea name="message" rows="2"></textarea></label>
          <button type="submit">Request a private showing</button>
        </form>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script>
(() => {
  const FILM = JSON.parse(document.getElementById("film").textContent);
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const small = matchMedia("(max-width: 760px), (orientation: portrait)").matches;
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const ease = (t) => t * t * (3 - 2 * t);                    // smoothstep
  const filled = (s) => s && !/\{\{.*\}\}/.test(s);             // hide unfilled template slots
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- palette: the property sets the tone ----------
  for (const [k, v] of Object.entries(FILM.palette || {})) document.documentElement.style.setProperty(`--${k}`, v);

  // ---------- words ----------
  const P = FILM.property, A = FILM.agent || {};
  document.title = filled(P.address) ? `${P.address} — ${P.location}` : "Estate Film";
  $("barAddress").textContent = filled(P.address) ? P.address : "";
  $("heroTitle").textContent = filled(P.address) ? P.address : "";
  $("heroMeta").innerHTML = [P.location, P.price, P.line].filter(filled).map((s) => `<span>${esc(s)}</span>`).join("");
  $("srTitle").textContent = [P.address, P.location, P.price].filter(filled).join(", ");
  $("agent").innerHTML = [
    filled(A.name) && `<b>${esc(A.name)}</b>`,
    filled(A.brokerage) && esc(A.brokerage),
    filled(A.phone) && `<a href="tel:${esc(A.phone.replace(/[^+\d]/g, ""))}">${esc(A.phone)}</a>`,
    filled(A.email) && `<a href="mailto:${esc(A.email)}">${esc(A.email)}</a>`,
  ].filter(Boolean).join("<br>") + `<br>Private showings by appointment`;
  $("footer").textContent = [P.address, P.location, A.brokerage].filter(filled).join("  ·  ");

  // ---------- stage + track ----------
  const stage = $("stage"), layer = $("layer");
  const scenes = FILM.scenes.map((s, i) => {
    const el = document.createElement("div");
    el.className = "shot";
    const img = document.createElement("img");
    img.alt = ""; img.decoding = "async"; if (s.poster) img.src = s.poster;
    img.style.objectPosition = s.focus || "50% 50%";
    el.appendChild(img);
    let video = null;
    const src = small && s.mobile ? s.mobile : s.video;
    if (src && !reduce) {
      video = document.createElement("video");
      video.muted = true; video.playsInline = true; video.preload = "auto";
      video.setAttribute("muted", ""); video.setAttribute("playsinline", "");
      video.style.objectPosition = s.focus || "50% 50%";
      el.classList.add("has-video", "waiting");
      el.insertBefore(video, img);
      video.addEventListener("error", () => { el.classList.remove("has-video"); scene.video = null; });
    }
    stage.appendChild(el);

    const caps = (s.captions || []).map((c) => {
      const d = document.createElement("div");
      d.className = `cap ${c.place || "right"}`;
      d.innerHTML = `<strong>${esc(c.text)}</strong>${c.sub ? `<small>${esc(c.sub)}</small>` : ""}`;
      layer.appendChild(d);
      return { el: d, at: c.at || [0.2, 0.8], place: c.place || "right" };
    });
    let facts = null;
    const list = (s.facts || []).filter(filled);
    if (list.length) {
      const ul = document.createElement("ul");
      ul.className = "facts";
      ul.innerHTML = list.map((f) => `<li>${esc(f)}</li>`).join("");
      layer.appendChild(ul);
      facts = { items: [...ul.children], at: s.factsAt || [0.2, 0.8] };
      list.forEach((f) => { const li = document.createElement("li"); li.textContent = f; $("srFacts").appendChild(li); });
    }
    const scene = { ...s, i, el, img, video, src, caps, facts, length: s.length || 1.5, shown: -1, t: 0, ready: false };
    return scene;
  });
  stage.insertAdjacentHTML("beforeend", '<div class="veil"></div>');

  const total = scenes.reduce((a, s) => a + s.length, 0);
  const track = $("track");
  track.style.height = `${total * 100}vh`;
  const starts = []; scenes.reduce((a, s) => (starts.push(a / total), a + s.length), 0);
  const BLEND = 0.1;   // share of a scene spent dissolving into the next (chained clips make it invisible)

  // ---------- loading: fetch whole clips so seeking never waits on the network ----------
  const loader = $("loader"), bar = loader.querySelector("i");
  async function load(scene) {
    if (!scene.video) { scene.ready = true; return; }
    const v = scene.video;
    try {
      if (location.protocol === "file:") throw new Error("file");
      const res = await fetch(scene.src);
      if (!res.ok) throw new Error(res.status);
      v.src = URL.createObjectURL(await res.blob());
    } catch { v.src = scene.src; }
    await new Promise((ok) => {
      const done = () => ok();
      v.addEventListener("loadeddata", done, { once: true });
      v.addEventListener("error", done, { once: true });
      setTimeout(done, 15000);
    });
    scene.ready = true;
    if (scene.video) { v.currentTime = 0.001; scene.el.classList.remove("waiting"); }
  }
  (async () => {
    // First scene gates the reveal; the rest stream in order behind it.
    await load(scenes[0]);
    loader.classList.add("done");
    for (let i = 1; i < scenes.length; i++) { await load(scenes[i]); bar.style.setProperty("--p", i / (scenes.length - 1)); }
  })();
  bar.style.setProperty("--p", 0.15);

  // ---------- scroll → film ----------
  let progress = 0;
  function trackProgress() {
    const r = track.getBoundingClientRect();
    const span = r.height - innerHeight;
    return span > 0 ? clamp01(-r.top / span) : 0;
  }
  function fade(t, [a, b], edge = 0.12) {
    // 0 before a, ramps to 1, holds, ramps back to 0 at b.
    return Math.min(ease(clamp01((t - a) / edge)), ease(clamp01((b - t) / edge)));
  }

  function render() {
    const p = progress;
    $("rail").style.transform = `scaleX(${p})`;
    let cur = scenes.length - 1;
    for (let i = 0; i < scenes.length; i++) if (p < starts[i] + scenes[i].length / total) { cur = i; break; }

    scenes.forEach((s, i) => {
      const local = clamp01((p - starts[i]) / (s.length / total));
      s.t = local;
      // Opacity: current is 1; the next fades in over the last BLEND of the current.
      let o = 0;
      if (i === cur) o = 1;
      else if (i === cur + 1) o = ease(clamp01((scenes[cur].t - (1 - BLEND)) / BLEND));
      s.el.style.opacity = o;
      s.el.style.zIndex = i === cur + 1 ? 2 : 1;
      if (o > 0) drive(s, local);

      s.caps.forEach((c) => {
        const v = i === cur || (i === cur + 1 && o > 0.5) ? fade(local, c.at) : 0;
        c.el.style.opacity = v;
        const lift = (1 - v) * 18;
        c.el.style.transform = c.place === "center" ? `translate(-50%, calc(-50% + ${lift}px))` : `translateY(calc(-50% + ${lift}px))`;
      });
      if (s.facts) s.facts.items.forEach((li, k) => {
        const n = s.facts.items.length, [a, b] = s.facts.at, step = (b - a) * 0.35 / n;
        const v = i === cur ? fade(local, [a + k * step, b], 0.1) : 0;
        li.style.opacity = v; li.style.transform = `translateY(${(1 - v) * 14}px)`;
      });
    });

    // Hero title lives only in the opening stretch; the finale owns the end.
    const h = 1 - ease(clamp01((scenes[0].t - 0.18) / 0.2));
    $("hero").style.opacity = cur === 0 ? h : 0;
    $("hero").style.transform = `translateY(${(1 - h) * -20}px)`;
    const idx = cur + (scenes[cur + 1] && scenes[cur].t > 1 - BLEND / 2 ? 1 : 0);
    $("chapNum").textContent = String(idx + 1).padStart(2, "0");
    $("chapName").textContent = scenes[idx].chapter || "";
    // The finale's form owns the bottom of the screen once the film has run out.
    document.querySelector(".chapter").style.opacity = 1 - ease(clamp01((p - 0.97) / 0.03));
    // Finale copy fades up as it rises, so a half-entered headline never reads as a glitch.
    const top = showing.getBoundingClientRect().top;
    showingInner.style.opacity = ease(clamp01((innerHeight * 0.7 - top) / (innerHeight * 0.45)));
  }
  const showing = $("showing"), showingInner = showing.querySelector(".showing");

  function drive(s, local) {
    if (s.video && s.ready && s.video.duration) {
      const target = local * (s.video.duration - 0.04);
      // Ease toward the target so a flick of the wheel glides instead of jumping.
      s.shown = s.shown < 0 ? target : s.shown + (target - s.shown) * 0.28;
      if (!s.video.seeking && Math.abs(s.video.currentTime - s.shown) > 1 / 90) s.video.currentTime = s.shown;
    } else if (!reduce) {
      // Stills fallback: a slow push so a missing clip still moves.
      s.img.style.transform = `scale(${1 + 0.08 * local})`;
    }
  }

  // ---------- form: posts JSON if an endpoint is set, else opens mail to the agent ----------
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.currentTarget;
    if (!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    const action = FILM.form && FILM.form.action;
    try {
      if (action) {
        const r = await fetch(action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...data, property: P.address }) });
        if (!r.ok) throw new Error(r.status);
      } else if (filled(A.email)) {
        const body = `Name: ${data.name}\nEmail: ${data.email}\nPhone: ${data.phone}\nPreferred date: ${data.date}\n\n${data.message}`;
        location.href = `mailto:${A.email}?subject=${encodeURIComponent(`Private showing — ${P.address}`)}&body=${encodeURIComponent(body)}`;
      }
      f.innerHTML = `<p class="sent">Thank you. ${filled(A.name) ? esc(A.name) : "The listing agent"} will be in touch to arrange your visit.</p>`;
    } catch {
      f.querySelector("button").textContent = "Could not send — please call or email";
    }
  });

  // ---------- loop: Lenis + ScrollTrigger when present, plain scroll when not ----------
  let lenis = null;
  if (!reduce && window.Lenis) {
    lenis = new Lenis({ lerp: 0.085, smoothWheel: true });
    document.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault(); lenis.scrollTo(a.getAttribute("href"), { duration: 2.4 });
    }));
  }
  if (window.gsap && window.ScrollTrigger) {
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.create({ trigger: track, start: "top top", end: "bottom bottom", onUpdate: (st) => { progress = st.progress; } });
    if (lenis) { lenis.on("scroll", ScrollTrigger.update); gsap.ticker.add((t) => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0); }
    gsap.ticker.add(render);
  } else {
    const loop = (t) => { if (lenis) lenis.raf(t); progress = trackProgress(); render(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  addEventListener("resize", () => window.ScrollTrigger && ScrollTrigger.refresh());
  render();
})();
</script>
</body>
</html>
