<!doctype html>
<!-- The design check's "every AI site" fixture: each tell on purpose. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Company</title>
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: #fff; color: #111; }

  .card { border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.1); background: #fff; padding: 24px; height: 120px; }
  .wide { width: 2000px; height: 10px; }
  .faint { color: #ddd; }
</style></head>
<body>
  <section class="hero"><h2>Welcome to Your Company</h2><p>Lorem ipsum dolor sit amet.</p><button class="btn">Get Started</button> <button class="btn">Learn More</button></section>
  <section class="grid"><div class="card">Feature 1</div><div class="card">Feature 2</div><div class="card">Feature 3</div></section>
  <section class="grid"><div class="card">Service 1</div><div class="card">Service 2</div><div class="card">Service 3</div></section>
  <section class="grid"><div class="card">Plan 1</div><div class="card">Plan 2</div><div class="card">Plan 3</div></section>
  <section class="grid"><div class="card">Testimonial 1</div><div class="card">Testimonial 2</div><div class="card">Testimonial 3</div></section>
  <div class="wide"></div>
  <p class="faint">Faint one</p><p class="faint">Faint two</p><p class="faint">Faint three</p>
  <img src="/missing.png">

</body></html>
